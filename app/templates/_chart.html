{# Kursverlauf: eine Serie, eine Achse. Ereignismarker tragen ihre Identität
   über die Form (Dreieck auf/ab, offener Kreis), nicht allein über die Farbe. #}
<figure class="chart-figure">
  <figcaption class="chart-caption">
    Schlusskurse der letzten {{ d.chart.hover|length }} Handelstage
    {%- if d.exchange %} · {{ d.exchange }}{% endif %}
  </figcaption>

  {% if d.chart.empty %}
    <p class="empty">Noch keine Kursdaten für diesen Titel.</p>
  {% else %}
  <div class="chart-wrap">
    <svg class="price-chart" viewBox="0 0 {{ d.chart.width }} {{ d.chart.height }}"
         role="img" preserveAspectRatio="xMidYMid meet"
         aria-label="Kursverlauf {{ d.symbol }} mit Markierungen der Quartalsmeldungen">

      {# Hairline-Gitter, solid und zurückgenommen #}
      {% for t in d.chart.y_ticks %}
        <line class="grid" x1="{{ d.chart.plot_left }}" y1="{{ t.position }}"
              x2="{{ d.chart.plot_right }}" y2="{{ t.position }}"></line>
        <text class="axis-label" x="{{ d.chart.plot_right + 6 }}" y="{{ t.position + 3.5 }}"
              >{{ t.label }}</text>
      {% endfor %}

      <path class="area" d="{{ d.chart.area }}"></path>
      <polyline class="line" points="{{ d.chart.line }}"></polyline>

      {% for t in d.chart.x_ticks %}
        <text class="axis-label" x="{{ t.position }}" y="{{ d.chart.height - 8 }}"
              text-anchor="{{ t.anchor }}">{{ t.label }}</text>
      {% endfor %}

      {# Ereignismarker. Form = Identität, Farbe = Verstärkung. #}
      {% for m in d.chart.markers %}
        {% if m.kind == 'BUY' %}
          <path class="marker buy" tabindex="0" role="img"
                aria-label="Kaufsignal am {{ m.date }}"
                data-date="{{ m.date }}" data-close="{{ m.close }}" data-label="{{ m.label }}"
                d="M {{ m.x }},{{ m.y - 6 }} L {{ m.x + 5.2 }},{{ m.y + 3 }} L {{ m.x - 5.2 }},{{ m.y + 3 }} Z"></path>
        {% elif m.kind == 'SELL' %}
          <path class="marker sell" tabindex="0" role="img"
                aria-label="Verkaufssignal am {{ m.date }}"
                data-date="{{ m.date }}" data-close="{{ m.close }}" data-label="{{ m.label }}"
                d="M {{ m.x }},{{ m.y + 6 }} L {{ m.x + 5.2 }},{{ m.y - 3 }} L {{ m.x - 5.2 }},{{ m.y - 3 }} Z"></path>
        {% else %}
          <circle class="marker neutral" tabindex="0" role="img"
                  aria-label="Meldung ohne Signal am {{ m.date }}"
                  data-date="{{ m.date }}" data-close="{{ m.close }}" data-label="{{ m.label }}"
                  cx="{{ m.x }}" cy="{{ m.y }}" r="4.5"></circle>
        {% endif %}
      {% endfor %}

      {# Endpunkt direkt beschriftet – kein Wert an jedem Punkt #}
      <circle class="end-dot" cx="{{ d.chart.last_x }}" cy="{{ d.chart.last_y }}" r="4"></circle>
      <text class="end-label" x="{{ d.chart.plot_right + 6 }}" y="{{ d.chart.last_y + 3.5 }}"
            >{{ d.chart.last_label }}</text>

      <line class="crosshair" x1="0" y1="{{ d.chart.plot_top }}" x2="0"
            y2="{{ d.chart.plot_bottom }}" hidden></line>
      <circle class="crosshair-dot" r="4" hidden></circle>
      <rect class="hit" x="{{ d.chart.plot_left }}" y="{{ d.chart.plot_top }}"
            width="{{ d.chart.plot_right - d.chart.plot_left }}"
            height="{{ d.chart.plot_bottom - d.chart.plot_top }}" fill="transparent"></rect>
    </svg>

    <div class="chart-tooltip" hidden>
      <span class="tt-value"></span>
      <span class="tt-date"></span>
      <span class="tt-note"></span>
    </div>
  </div>

  <ul class="chart-legend">
    <li><span class="key buy"></span>Kaufsignal</li>
    <li><span class="key sell"></span>Verkaufssignal</li>
    <li><span class="key neutral"></span>Meldung ohne Signal</li>
  </ul>

  <details class="chart-table">
    <summary>Werte als Tabelle</summary>
    <div class="scroll">
      <table>
        <thead><tr><th>Datum</th><th class="num">Schlusskurs</th><th>Ereignis</th></tr></thead>
        <tbody>
          {% set marker_by_date = {} %}
          {% for m in d.chart.markers %}{% set _ = marker_by_date.update({m.date: m.label}) %}{% endfor %}
          {% for h in d.chart.hover|reverse %}
            <tr>
              <td>{{ h.date }}</td>
              <td class="num">{{ h.close|num }}</td>
              <td class="muted">{{ marker_by_date.get(h.date, '–') }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </details>
  {% endif %}
</figure>

{% if not d.chart.empty %}
<script type="application/json" id="chart-points">
  {{ d.chart.hover_data | tojson }}
</script>
<script>
(function () {
  // Fadenkreuz: der Leser zielt auf ein Datum, nicht auf eine 2px-Linie.
  var data = JSON.parse(document.getElementById('chart-points').textContent);
  var svg = document.querySelector('.price-chart');
  var wrap = document.querySelector('.chart-wrap');
  var tip = document.querySelector('.chart-tooltip');
  if (!svg || !data.length) return;

  var line = svg.querySelector('.crosshair');
  var dot = svg.querySelector('.crosshair-dot');
  var markers = {};
  svg.querySelectorAll('.marker').forEach(function (m) {
    markers[m.dataset.date] = m.dataset.label;
  });

  function nearest(svgX) {
    var best = data[0], bestDist = Math.abs(data[0].x - svgX);
    for (var i = 1; i < data.length; i++) {
      var dist = Math.abs(data[i].x - svgX);
      if (dist < bestDist) { best = data[i]; bestDist = dist; }
    }
    return best;
  }

  function show(point, clientX, clientY) {
    line.setAttribute('x1', point.x); line.setAttribute('x2', point.x);
    line.hidden = false;
    dot.setAttribute('cx', point.x); dot.setAttribute('cy', point.y);
    dot.hidden = false;
    // textContent, nicht innerHTML: die Werte kommen aus einer API.
    tip.querySelector('.tt-value').textContent =
      point.close.toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    tip.querySelector('.tt-date').textContent = point.date;
    tip.querySelector('.tt-note').textContent = markers[point.date] || '';
    tip.hidden = false;
    var box = wrap.getBoundingClientRect();
    var x = clientX - box.left;
    tip.style.left = Math.max(4, Math.min(box.width - tip.offsetWidth - 4, x - tip.offsetWidth / 2)) + 'px';
    tip.style.top = Math.max(0, (clientY - box.top) - tip.offsetHeight - 14) + 'px';
  }

  function hide() { line.hidden = true; dot.hidden = true; tip.hidden = true; }

  function toSvgX(clientX) {
    var box = svg.getBoundingClientRect();
    return (clientX - box.left) / box.width * svg.viewBox.baseVal.width;
  }

  svg.addEventListener('pointermove', function (e) {
    show(nearest(toSvgX(e.clientX)), e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', hide);

  // Dieselben Angaben bei Tastaturfokus auf einem Marker.
  svg.querySelectorAll('.marker').forEach(function (m) {
    m.addEventListener('focus', function () {
      var point = data.filter(function (p) { return p.date === m.dataset.date; })[0];
      if (!point) return;
      var box = svg.getBoundingClientRect();
      var scale = box.width / svg.viewBox.baseVal.width;
      show(point, box.left + point.x * scale, box.top + point.y * scale);
    });
    m.addEventListener('blur', hide);
  });
})();
</script>
{% endif %}
